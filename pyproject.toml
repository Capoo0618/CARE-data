[project]
name = "care-data"
version = "0.1.0"
description = "CARE 健康資料 ETL：食藥署／疾管署／TFC 爬蟲與 MongoDB 寫入"
readme = "README.md"
# 與 .github/workflows/etl_pipeline.yml 的 setup-python 一致
requires-python = ">=3.10"

dependencies = [
    "requests==2.31.0",
    "beautifulsoup4==4.12.3",
    "pymongo==4.6.2",
    "python-dotenv==1.0.1",
    "schedule==1.2.1",
    "urllib3==2.2.1",
    # gov.tw 站台要釘 TWCA 中繼憑證才連得上（見 ca_bundle.py），
    # 憑證庫版本太舊會讓爬蟲整批誤判為「連不上」。
    "certifi>=2024.2.2",
]

# ETL 是可執行腳本集合不是函式庫，不建置成套件。
[tool.uv]
package = false
