name: Daily Health ETL Pipeline

on:

1. 支援手動從 GitHub 網頁上點擊按鈕觸發測試

workflow_dispatch:

2. 排程自動觸發 (Cron Job)

注意：GitHub 伺服器使用的是 UTC 時間，台灣是 UTC+8。

所以設定 UTC 的 00:00，等於台灣時間每天早上的 08:00 執行。

schedule:
- cron: '0 0 * * *'

jobs:
run-etl:
runs-on: ubuntu-latest

steps:
  # 步驟 1：把你的程式碼從 GitHub 抓下來到虛擬機上
  - name: Checkout Code
    uses: actions/checkout@v3

  # 步驟 2：在虛擬機上安裝 Python 環境
  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  # 步驟 3：根據清單安裝爬蟲需要的套件
  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # 步驟 4：執行主程式
  # 我們在這裡把 GitHub Secrets 傳進虛擬機的環境變數裡，程式才拿得到 Key
  - name: Run ETL Pipeline
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
    run: python main_pipeline.py
