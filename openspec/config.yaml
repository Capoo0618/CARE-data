schema: spec-driven

context: |
  專案：CARE-data（LINE 健康闢謠機器人的後台 ETL 資料管線）
  Repo：Capoo0618/CARE-data
  角色：唯一的知識庫寫入端。下游 CARE Backend（Yanagi-0912/CARE）只讀不寫，
        兩者透過 MongoDB Atlas 的 health_articles_chunks collection 解耦。

  技術棧：Python、requests、BeautifulSoup、Gemini Embedding API、MongoDB Atlas、GitHub Actions
  排程：.github/workflows/etl_pipeline.yml，cron '0 0 * * *'（UTC）＝台灣時間每日 08:00
  進入點：main_pipeline.py（job() → 爬蟲模組 → chunk → embed → Mongo）

  模組：
    - scraper_api.py：食藥署 DataAction／衛福部 newsapi.ashx 兩支 JSON API
    - scraper_tfc.py：台灣事實查核中心網頁爬蟲（BeautifulSoup + 翻頁）
    - utils.py：兩支爬蟲共用的 HTML 清洗
    - main_pipeline.py：切片、向量化、寫入、排程
    - test_system.py：單元測試＋對來源網站的動態一致性驗證

  環境變數：GEMINI_API_KEY、MONGO_URI（本機放 .env；CI 放 GitHub Actions secrets）

  規格（單一真相）：openspec/specs/
  進行中的變更：openspec/changes/
  語言：面向使用者文件與 commit／PR 描述使用繁體中文

  下游契約（改動前務必確認）：
    CARE Backend 讀取的欄位為 chunk_content（內文）、embedding（3072 維）、
    source_name、url、original_title、chunk_index、total_chunks。
    Atlas 有兩個索引：vector_index（vectorSearch，3072/cosine）與
    care_text_index（Atlas Search，analyzer 須為 lucene.cjk，中文才切得動）。
    任何改變 chunk_content 內容或 embedding 產生方式的變更，都會使既有向量失效，
    需全量重建並與 CARE 端協調 cutover。

  工作流程：
  1. openspec new <change>；於 changes/<change>/ 撰寫 proposal → design（可選）→ tasks
  2. 開 branch 實作，維持小步、聚焦單一變更
  3. python test_system.py 全綠才算完成
  4. 建立清楚的 git commit / PR
  5. 合併後執行 openspec archive <change>，內容併入 specs/

rules:
  proposal:
    - 說明對下游 CARE Backend 的影響：是否改變 chunk_content 內容、是否使既有 embedding 失效
    - 若需全量重建知識庫，必須寫明重建成本、遷移策略與 cutover 方式
  tasks:
    - 引用 test_system.py 或新增測試檔中對應的測試名稱
    - 對外部來源（政府 API、TFC 網站、Gemini、MongoDB）的呼叫須可用依賴注入或假件測試，
      不得讓單元測試在 CI 依賴真實網路
    - 完成定義（Definition of Done）：python test_system.py 全綠且有清楚的 git commit
  spec:
    - 寫入知識庫的每一篇文章，其所有 chunk 必須全部成功向量化才寫入（全有或全無），
      不得留下部分寫入的破洞
