name: Daily Health ETL Pipeline

on:
  schedule:
    # UTC 20:00＝台北 04:00。不是想在凌晨跑，是 GitHub 的 cron 會延遲觸發：
    # 原本設 UTC 00:00（台北 08:00），2026-09-08～09-13 六次實際都在 UTC
    # 02:29～02:37 才開跑、03:30～03:48 結束，也就是台北 10:30 開跑、11:50 前
    # 跑完——比 09:00 的每日推播晚，當天抓的東西只能隔天推。提前 4 小時後，
    # 以同樣的延遲約台北 06:30 開跑、08:00 前跑完。
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    # 增量執行約 10 分鐘；切法換版的重切期間會長得多——四個來源的爬蟲約 43
    # 分鐘，加上跑滿當日 1,000 次 embedding 額度的時間。
    #
    # 曾設 90 分鐘，2026-08-23 那次重切因此在還沒用完額度（只用了 978 次）就被
    # 砍在正常寫入的中途，等於每天只能推進約 280 篇、永遠做不完。放寬到 300
    # 分鐘讓重切能完成，同時仍比 GitHub 預設的 360 分鐘早——「卡住」還是會變成
    # 紅燈，只是門檻拉到重切也放得下的高度。
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true

      # --locked：uv.lock 與 pyproject.toml 不一致就讓 CI 失敗，而非默默重解版本
      - name: Install Dependencies
        run: uv sync --locked

      - name: Run ETL Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: uv run python main_pipeline.py