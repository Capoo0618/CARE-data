schema: spec-driven

context: |
  專案：CARE-data（CARE 健康闢謠與一般衛教 RAG 的後台 ETL 資料管線）
  Repo：Capoo0618/CARE-data
  角色：排程知識庫寫入端。下游 CARE Backend（Yanagi-0912/CARE）讀取 MongoDB
        內文與 pgvector 向量；人工知識回報收錄的 Mongo embedding 由 reconcile 搬進 PG。

  技術棧：Python >=3.10、uv、requests、BeautifulSoup、Gemini Embedding API、MongoDB Atlas、pgvector
  排程：CARE-infra care-etl CronJob，台灣時間每日 05:00（ETL_RUN_ONCE=1）；GitHub Actions 只測試與通知部署
  進入點：main_pipeline.py（job() → 爬蟲模組 → chunk → embed → Mongo／PG → 補標籤 → reconcile）

  模組：
    - scraper_api.py：食藥署 DataAction／國健署 newsapi.ashx 兩支 JSON API
    - scraper_fda.py：食藥署闢謠專區網頁爬蟲
    - scraper_mohw.py：衛福部真相說明跨機關彙整頁（含疾管署闢謠專區）
    - scraper_cdc.py：疾管署傳染病索引 → 疾病專頁 → 疾病介紹（一般衛教）
    - scraper_tfc.py：台灣事實查核中心網頁爬蟲（BeautifulSoup + 翻頁）
    - scraper_cofacts.py：Cofacts 查核來源
    - claim_tagger.py：只對闢謠來源白名單補主張與判定，不對一般衛教標記
    - vector_store.py：pgvector 寫入與 Mongo／PG 切片 ID、判定對帳
    - scraper_media.py：媒體推播資料（daily_health_news，與本知識庫分開）
    - utils.py：爬蟲共用的 HTML 清洗與編碼處理
    - main_pipeline.py：切片、向量化、寫入、排程
    - test_system.py：單元測試＋對來源網站的動態一致性驗證

  環境變數：GEMINI_API_KEY、MONGO_URI、PGVECTOR_SYNC_DSN、ETL_RUN_ONCE（正式設定來自叢集 Secret）

  規格（單一真相）：openspec/specs/
  進行中的變更：openspec/changes/
  語言：面向使用者文件與 commit／PR 描述使用繁體中文

  下游契約（改動前務必確認）：
    MongoDB CARE_database.health_articles_chunks 存 chunk_content（內文）、source_name、
    url、original_title、chunk_index、total_chunks、日期、判定與 chunker_version；不存新向量。
    PG health_articles_chunks 存 id（Mongo _id 字串）、embedding vector(3072)、
    embedding_half halfvec(3072)、verdict。新來源不改表、不重建索引。
    daily_health_news 是媒體推播資料，不是一般衛教的入庫目標。
    任何改變 chunk_content 內容或 embedding 產生方式的變更，都會使既有向量失效，
    需全量重建並與 CARE 端協調 cutover。

  工作流程（本 change 採用的慣例，供參考；是否採用由 repo 維護者決定。
  第 1 與第 5 步需要 openspec CLI；不安裝也不影響 ETL 執行或測試，
  changes/ 底下就是純 Markdown，直接讀寫即可）：
  1. openspec new <change>；於 changes/<change>/ 撰寫 proposal → design（可選）→ tasks
  2. 開 branch 實作，維持小步、聚焦單一變更
  3. python test_system.py 全綠才算完成
  4. 建立清楚的 git commit / PR
  5. 合併後執行 openspec archive <change>，內容併入 specs/

rules:
  proposal:
    - 說明對下游 CARE Backend 的影響：是否改變 chunk_content 內容、是否使既有 embedding 失效
    - 若需全量重建知識庫，必須寫明重建成本、遷移策略與 cutover 方式
  tasks:
    - 引用 test_system.py 或新增測試檔中對應的測試名稱
    - 測試分兩類，不要混：
      (a) 純函式／寫入邏輯的單元測試——對外部來源（Gemini、MongoDB）的呼叫須以
          依賴注入傳入假件，不得在測試中真的發出網路請求
      (b) 對來源網站／API 的動態一致性驗證（現有 test_02、test_03）——刻意打真實網路，
          用途是抓「爬蟲邏輯與來源實際格式脫節」，這類測試應保留其線上特性
    - 完成定義（Definition of Done）：python test_system.py 全綠且有清楚的 git commit
  spec:
    - 寫入知識庫的每一篇文章，其所有 chunk 必須全部成功向量化才寫入（全有或全無），
      不得留下部分寫入的破洞
